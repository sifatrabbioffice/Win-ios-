name: Build Unsigned Wine-Container IPA (Madeira)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-wine-ipa:
    name: Build Unsigned Wine IPA
    runs-on: macos-15          # M2 চিপের জন্য macOS 14 সবচেয়ে ভালো (Xcode 15.4+)
    #timeout-minutes: 240        # ৪ ঘণ্টা (বিল্ড দীর্ঘ হতে পারে)

    steps:
      # ────────────────────────────────────────────────
      # ১. সোর্স কোড ক্লোন (সাবমডিউল সহ)
      # ────────────────────────────────────────────────
      - name: Checkout Madeira Source
        uses: actions/checkout@v4
        with:
          repository: willfaust/Madeira
          submodules: recursive          # FEX, Wine, DXMT সাবমডিউল আনবে
          fetch-depth: 0
          path: Madeira

      # ────────────────────────────────────────────────
      # ২. Xcode সেটআপ
      # ────────────────────────────────────────────────
      - name: Set up Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      # ────────────────────────────────────────────────
      # ৩. ডিপেন্ডেন্সি ক্যাশ (বিল্ড দ্রুত করার জন্য)
      # ────────────────────────────────────────────────
      - name: Cache Homebrew, Cargo, CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/.cargo
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-madeira-deps-${{ hashFiles('Madeira/**/Makefile', 'Madeira/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-madeira-deps-

      # ────────────────────────────────────────────────
      # ৪. বিল্ড টুল ইনস্টল (llvm, lld, ninja, bison, flex, etc.)
      # ────────────────────────────────────────────────
      - name: Install Build Tools
        run: |
          echo "🔧 Installing build dependencies..."
          brew update || true
          brew install cmake ninja lld llvm bison flex \
            automake autoconf libtool pkg-config wget \
            python3 pipx || true
          sudo gem install cocoapods || true

      # ────────────────────────────────────────────────
      # ৫. পাইথন ডিপেন্ডেন্সি (Madeira build scripts এর জন্য)
      # ────────────────────────────────────────────────
      - name: Install Python Dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install pyyaml jinja2 meson

      # ────────────────────────────────────────────────
      # ৬. CocoaPods (যদি Podfile থাকে)
      # ────────────────────────────────────────────────
      - name: Install CocoaPods Dependencies
        working-directory: Madeira
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "No Podfile found, skipping."
          fi

      # ────────────────────────────────────────────────
      # ৭. নেটিভ কম্পোনেন্ট বিল্ড (Wine Unix libs, ARM64EC PE, FEX, DXMT)
      # ────────────────────────────────────────────────
      - name: Build Native Components
        working-directory: Madeira
        run: |
          echo "🚀 Building native components (Wine, FEX, DXMT)..."
          # build/*/build.sh স্ক্রিপ্টগুলো এক্সিকিউটেবল করে নিন
          find build -name "build.sh" -exec chmod +x {} \;
          
          # প্রতিটি কম্পোনেন্ট বিল্ড (সিরিয়ালি, কারণ কিছু ডিপেন্ডেন্সি আছে)
          for script in build/wine/build.sh \
                        build/fex/build.sh \
                        build/dxmt/build.sh \
                        build/ffmpeg/build.sh \
                        build/madeira-dock/build.sh; do
            if [ -f "$script" ]; then
              echo "▶️ Running: $script"
              bash "$script" || echo "⚠️ Warning: $script completed with errors"
            else
              echo "⏭️ Skipping: $script (not found)"
            fi
          done

      # ────────────────────────────────────────────────
      # ৮. আনসাইনড Xcode বিল্ড কনফিগারেশন
      # ────────────────────────────────────────────────
      - name: Configure Unsigned Build Settings
        working-directory: Madeira
        run: |
          mkdir -p build_output
          cat << 'EOF' > Unsigned.xcconfig
          // ── Code Signing ──
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY = 
          DEVELOPMENT_TEAM = 
          PROVISIONING_PROFILE_SPECIFIER = 

          // ── Architecture ──
          ENABLE_BITCODE = NO
          ONLY_ACTIVE_ARCH = NO
          ARCHS = arm64

          // ── JIT Entitlement (StikDebug এর জন্য প্রয়োজন) ──
          // get-task-allow = YES (Info.plist এ যোগ করা হবে)

          // ── Performance ──
          SWIFT_OPTIMIZATION_LEVEL = -Onone   // CI তে দ্রুত বিল্ড
          GCC_OPTIMIZATION_LEVEL = 0
          EOF

      # ────────────────────────────────────────────────
      # ৯. iOS অ্যাপ বিল্ড (xcodebuild)
      # ────────────────────────────────────────────────
      - name: Build iOS App
        working-directory: Madeira
        run: |
          echo "📱 Building iOS app with xcodebuild..."
          
          # স্কিম নাম খুঁজে বের করুন (সাধারণত "Madeira")
          SCHEME_NAME=$(xcodebuild -list 2>/dev/null | grep -A 5 "Schemes:" | tail -n +2 | head -n 1 | xargs) || SCHEME_NAME="Madeira"
          echo "Detected scheme: $SCHEME_NAME"

          xcodebuild clean build \
            -project Madeira.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_output \
            -xcconfig Unsigned.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            | xcpretty || \
          xcodebuild clean build \
            -project Madeira.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      # ────────────────────────────────────────────────
      # ১০. .app বান্ডল খুঁজে বের করা
      # ────────────────────────────────────────────────
      - name: Locate .app Bundle
        id: find_app
        working-directory: Madeira
        run: |
          APP_PATH=$(find build_output -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app bundle found!"
            exit 1
          fi
          echo "✅ Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────
      # ১১. Info.plist এ JIT entitlement যোগ করা (get-task-allow)
      # ────────────────────────────────────────────────
      - name: Add JIT Entitlement to Info.plist
        working-directory: Madeira
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          PLIST="$APP_PATH/Info.plist"
          
          if [ -f "$PLIST" ]; then
            echo "📝 Adding get-task-allow to Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :get-task-allow bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :get-task-allow true" "$PLIST" 2>/dev/null || true
            
            # ন্যূনতম iOS সংস্করণ নিশ্চিত করুন
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 17.4" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 17.4" "$PLIST" 2>/dev/null || true
          fi

      # ────────────────────────────────────────────────
      # ১২. IPA প্যাকেজিং
      # ────────────────────────────────────────────────
      - name: Package into IPA
        working-directory: Madeira
        run: |
          echo "📦 Packaging .app into .ipa..."
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          APP_NAME=$(basename "$APP_PATH")

          rm -rf Payload_Directory
          mkdir -p Payload_Directory/Payload
          cp -R "$APP_PATH" Payload_Directory/Payload/

          cd Payload_Directory
          zip -r9 ../Madeira_Unsigned.ipa Payload
          cd ..

          echo "✅ IPA created:"
          ls -lh Madeira_Unsigned.ipa

      # ────────────────────────────────────────────────
      # ১৩. আর্টিফ্যাক্ট আপলোড
      # ────────────────────────────────────────────────
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira/Madeira_Unsigned.ipa
          retention-days: 30
