name: Build Unsigned Wine-Container IPA (Madeira)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-wine-ipa:
    name: Build Unsigned Wine IPA (Official Flow)
    runs-on: macos-14

    steps:
      # ────────────────────────────────────────────────
      # ১. সোর্স কোড ক্লোন (সাবমডিউল সহ)
      # ────────────────────────────────────────────────
      - name: Checkout Madeira Source
        uses: actions/checkout@v4
        with:
          repository: willfaust/Madeira
          submodules: recursive
          fetch-depth: 0
          path: Madeira

      # ────────────────────────────────────────────────
      # ২. Xcode সেটআপ
      # ────────────────────────────────────────────────
      - name: Set up Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      # ────────────────────────────────────────────────
      # ৩. ক্যাশিং সেটআপ (ccache + Homebrew + Cargo)
      # ────────────────────────────────────────────────
      - name: Setup ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('Madeira/**/*.cpp', 'Madeira/**/*.h', 'Madeira/**/*.c', 'Madeira/**/*.cc', 'Madeira/**/*.sh', 'Madeira/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/.cargo
            ~/Library/Caches/CocoaPods
            Madeira/toolchains
          key: ${{ runner.os }}-madeira-deps-${{ hashFiles('Madeira/**/Makefile', 'Madeira/**/CMakeLists.txt', 'Madeira/**/*.cmake', 'Madeira/**/*.sh', 'Madeira/**/*.h', 'Madeira/**/*.cpp', 'Madeira/**/*.cc', 'Madeira/**/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-madeira-deps-

      # ────────────────────────────────────────────────
      # ৪. বিল্ড ডিপেনডেন্সি ও টুলস ইনস্টল
      # ────────────────────────────────────────────────
      - name: Install Build Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          echo "🔧 Installing build dependencies..."
          brew install cmake ninja lld llvm bison flex \
            automake autoconf libtool pkg-config wget \
            python3 pipx ccache p7zip || true
          sudo gem install cocoapods || true

      # ────────────────────────────────────────────────
      # ৫. পাইথন ডিপেনডেন্সি
      # ────────────────────────────────────────────────
      - name: Install Python Dependencies
        run: |
          pip3 install --upgrade pip --quiet --break-system-packages || true
          pip3 install pyyaml jinja2 meson --quiet --break-system-packages

      # ────────────────────────────────────────────────
      # ৬. LLVM-MinGW Toolchain সঠিক পাথে সেটআপ
      # ────────────────────────────────────────────────
      - name: Setup LLVM-MinGW Cross-Compiler
        working-directory: Madeira
        run: |
          echo "🛠️ Configuring LLVM-MinGW Toolchain..."
          mkdir -p toolchains
          
          # Madeira স্ক্রিপ্ট অনুযায়ী নির্দিষ্ট টুলচেইন ফোল্ডার মেলানো
          TARGET_DIR="toolchains/llvm-mingw-20240619-ucrt-macos-universal"
          if [ ! -d "$TARGET_DIR" ]; then
            wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-macos-universal.tar.xz -O llvm-mingw.tar.xz
            tar -xf llvm-mingw.tar.xz -C toolchains/
            rm -f llvm-mingw.tar.xz
          fi
          
          MINGW_BIN="$(pwd)/$TARGET_DIR/bin"
          echo "$MINGW_BIN" >> $GITHUB_PATH
          echo "LLVM_MINGW=$(pwd)/$TARGET_DIR" >> $GITHUB_ENV

      # ────────────────────────────────────────────────
      # ৭. CocoaPods ডিপেনডেন্সি ইনস্টল
      # ────────────────────────────────────────────────
      - name: Install CocoaPods
        working-directory: Madeira
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          elif [ -f "app/Podfile" ]; then
            cd app && pod install --repo-update
          fi

      # ────────────────────────────────────────────────
      # ৮. নেটিভ বাইনারি স্ক্রিপ্ট এক্সিকিউশন (Explicit Order)
      # ────────────────────────────────────────────────
      - name: Build Native Container Components
        working-directory: Madeira
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_COMPRESS: "1"
          MAKEFLAGS: "-j$(sysctl -n hw.ncpu)"
        run: |
          echo "🚀 Compiling Madeira Native Components..."
          ccache -s || true
          
          # স্ক্রিপ্ট এক্সিকিউট করার অনুমতি প্রদান
          find build -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          
          # নির্দিষ্ট ক্রমানুসারে মূল বিল্ড স্ক্রিপ্টগুলো রান
          SCRIPTS=(
            "build/ffmpeg/build.sh"
            "build/wine/build.sh"
            "build/fex/build.sh"
            "build/dxmt/build.sh"
            "build/madeira-dock/build.sh"
          )

          for script in "${SCRIPTS[@]}"; do
            if [ -f "$script" ]; then
              echo "▶️ Running Script: $script"
              bash "$script" || echo "⚠️ Warning: $script returned exit code $?"
            else
              echo "⏭️ Skipping: $script (file not found)"
            fi
          done
          
          ccache -z || true

      # ────────────────────────────────────────────────
      # ৯. আনসাইনড Xcode XCConfig
      # ────────────────────────────────────────────────
      - name: Create XCConfig
        working-directory: Madeira
        run: |
          mkdir -p build_output
          cat << 'EOF' > Unsigned.xcconfig
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY = 
          DEVELOPMENT_TEAM = 
          PROVISIONING_PROFILE_SPECIFIER = 

          ENABLE_BITCODE = NO
          ONLY_ACTIVE_ARCH = NO
          ARCHS = arm64

          SWIFT_OPTIMIZATION_LEVEL = -O
          GCC_OPTIMIZATION_LEVEL = s
          EOF

      # ────────────────────────────────────────────────
      # ১০. Xcode App Compilation & Target Determination
      # ────────────────────────────────────────────────
      - name: Build iOS App with xcodebuild
        working-directory: Madeira
        run: |
          echo "📱 Determining Xcode Target..."
          
          if [ -d "Madeira.xcworkspace" ]; then
            TARGET="-workspace Madeira.xcworkspace"
          elif [ -d "app/Madeira.xcworkspace" ]; then
            TARGET="-workspace app/Madeira.xcworkspace"
          elif [ -d "Madeira.xcodeproj" ]; then
            TARGET="-project Madeira.xcodeproj"
          elif [ -d "app/Madeira.xcodeproj" ]; then
            TARGET="-project app/Madeira.xcodeproj"
          else
            TARGET="-project $(find . -name "*.xcodeproj" | head -n 1)"
          fi

          echo "Selected Target: $TARGET"

          SCHEME_NAME=$(xcodebuild $TARGET -list 2>/dev/null | grep -A 5 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="Madeira"
          fi
          echo "Selected Scheme: $SCHEME_NAME"

          xcodebuild clean build \
            $TARGET \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_output \
            -xcconfig Unsigned.xcconfig \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.ncpu) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            | xcpretty || \
          xcodebuild clean build \
            $TARGET \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_output \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.ncpu) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      # ────────────────────────────────────────────────
      # ১১. Locate Generated .app Bundle
      # ────────────────────────────────────────────────
      - name: Locate App Bundle
        id: find_app
        working-directory: Madeira
        run: |
          APP_PATH=$(find build_output -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: Compilation failed, no .app bundle created!"
            exit 1
          fi
          echo "Found .app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────
      # ১২. Add Entitlements & MinimumOSVersion
      # ────────────────────────────────────────────────
      - name: Configure Plist Entitlements
        working-directory: Madeira
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          PLIST="$APP_PATH/Info.plist"
          
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :get-task-allow bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :get-task-allow true" "$PLIST" 2>/dev/null || true
            
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 17.4" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 17.4" "$PLIST" 2>/dev/null || true
          fi

      # ────────────────────────────────────────────────
      # ১৩. IPA Packaging
      # ────────────────────────────────────────────────
      - name: Create IPA Package
        working-directory: Madeira
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          
          rm -rf Payload_Directory
          mkdir -p Payload_Directory/Payload
          cp -R "$APP_PATH" Payload_Directory/Payload/

          cd Payload_Directory
          zip -r9 ../Madeira_Unsigned.ipa Payload
          cd ..

          ls -lh Madeira_Unsigned.ipa

      # ────────────────────────────────────────────────
      # ১৪. Upload Artifact
      # ────────────────────────────────────────────────
      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira/Madeira_Unsigned.ipa
          retention-days: 30
